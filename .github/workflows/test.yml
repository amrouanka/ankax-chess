name: Engine Test

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Baseline git tag'
        required: true
        default: 'v1.0.4'
      games:
        description: 'Total games (must be even)'
        required: true
        default: '4000'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Build cutechess from source
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake qt6-base-dev
          git clone --depth 1 https://github.com/cutechess/cutechess.git /tmp/cutechess
          cd /tmp/cutechess
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          sudo find build -name "cutechess-cli" -exec cp {} /usr/local/bin/ \;
          chmod +x /usr/local/bin/cutechess-cli
          cutechess-cli --version

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          path: dev_src

      - name: Build dev
        run: |
          dotnet publish dev_src/AnkaX.csproj \
            -c Release -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishAot=false \
            -o dev_build
          chmod +x dev_build/AnkaX

      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline }}
          path: base_src

      - name: Build baseline
        run: |
          dotnet publish base_src/AnkaX.csproj \
            -c Release -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishAot=false \
            -o base_build
          chmod +x base_build/AnkaX

      - name: Run match
        run: |
          GAMES=${{ inputs.games }}
          HALF=$((GAMES / 2))
          cutechess-cli \
            -engine cmd=./dev_build/AnkaX name=Dev \
            -engine cmd=./base_build/AnkaX name=Base \
            -each tc=3+0.05 \
            -games 2 -rounds $HALF \
            -repeat 2 \
            -openings file=dev_src/books/UHO_4060_v4.epd \
              format=epd order=random plies=12 \
            -resign movecount=3 score=400 \
            -draw movenumber=30 movecount=5 score=10 \
            -maxmoves 200 \
            -concurrency 2 \
            -pgnout result.pgn \
            -recover

      - name: Upload PGN
        uses: actions/upload-artifact@v4
        with:
          name: match-pgn
          path: result.pgn